name: qmllint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # continue-on-error: the tree hasn't been run through qmllint before,
      # so its current warning count is unverified - this starts as an
      # advisory check (visible on every PR, doesn't block merge) until
      # someone confirms `nix develop -c qmllint -I . $(find . -name
      # '*.qml')` is clean locally, at which point drop this line to make
      # it a real gate.
      - name: Run qmllint
        continue-on-error: true
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            fail=0
            while IFS= read -r -d "" f; do
              qmllint -I . "$f" || fail=1
            done < <(find . -name "*.qml" -not -path "./.direnv/*" -print0)
            exit "$fail"
          '
